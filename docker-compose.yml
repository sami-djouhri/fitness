services:
  fitness:
    build: .
    container_name: fitness
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
      - /run
    ports:
      - "127.0.0.1:8094:8000"
    volumes:
      - fitness-data:/app/data
    environment:
      - PYTHONDONTWRITEBYTECODE=1
      - DATABASE_URL=sqlite:////app/data/app.db
      - MEALPREP_BASE_URL=http://mealprep:8000
      # Kalender, nur lesend: der Tagestyp entscheidet, ob ein Trainingstag
      # heute selbstverstaendlich ist. `kalender` loest ueber cc-apps auf,
      # dasselbe Netz, ueber das mealprep ihn schon erreicht. Ohne Token
      # bleibt der Adapter still und die App verhaelt sich wie bisher.
      - KALENDER_BASE_URL=${KALENDER_BASE_URL:-http://kalender:8085}
      - KALENDER_FEED_TOKEN=${KALENDER_FEED_TOKEN:-}
      - ADMIN_TOKEN=${ADMIN_TOKEN:-}   # aus .env (git-ignored), F1 Admin-Gate
      # Native Apps: HS256-Backend-JWT verifizieren (aud=fitness-api). Wert aus
      # .env (git-ignored), muss == SAGANTA_BACKEND_SECRET des auth-service sein.
      - SAGANTA_BACKEND_SECRET=${SAGANTA_BACKEND_SECRET:-}
      # Dieser Dienst hat KEIN env_file. Alles aus .env muss hier einzeln
      # durchgereicht werden, sonst steht der Wert in der Datei und kommt im
      # Container nie an. Beim Mandanten-Geheimnis waere das besonders tueckisch:
      # das Ausrollskript meldet einen Fingerabdruck, der Dienst bliebe still im
      # ungeprueften Zustand.
      - FITNESS_TENANT_SECRET=${FITNESS_TENANT_SECRET:-}
      # Das Geheimnis des NACHBARN, fuer Aufrufe an mealprep im Namen des
      # Nutzers (app/services/mealprep_adapter.py). Es fehlte hier bis zum
      # 2026-09-27, obwohl `fitness/.env` es trug und das Ausrollskript einen
      # Fingerabdruck meldete: genau der Fall, vor dem der Kommentar drei Zeilen
      # hoeher warnt, nur fuer das andere Geheimnis. Ohne diese Zeile haette ein
      # Scharfschalten von mealprep den Weg fitness->mealprep mit 401 gekappt,
      # und die Ursache haette in einer Datei gestanden, die richtig aussah.
      - MEALPREP_TENANT_SECRET=${MEALPREP_TENANT_SECRET:-}
      - TENANT_HEADER_ENFORCE=${TENANT_HEADER_ENFORCE:-0}
      # Benachrichtigungskanal (optional, siehe app/mqtt.py). Leer = aus, und
      # der Dienst laeuft unveraendert. Im Haus traegt der bestehende
      # Broker-Nutzer, es braucht keinen eigenen: die Datei kommt aus dem
      # Tresor (Notiz infra-mqtt) nach ./secrets/mqtt_password.
      - MQTT_HOST=${MQTT_HOST:-}
      - MQTT_PORT=${MQTT_PORT:-1883}
      - MQTT_USERNAME=${MQTT_USERNAME:-}
      - MQTT_PASSWORD_FILE=${MQTT_PASSWORD_FILE:-}
      # Token fuer POST /api/anstoss/pruefen. Leer = Endpunkt gesperrt.
      - ANSTOSS_TOKEN=${ANSTOSS_TOKEN:-}
      # Mandant fuer headerlose interne Aufrufer. Leer = niemand, fail-closed.
      - DEFAULT_OWNER_SUB=${DEFAULT_OWNER_SUB:-}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
    memswap_limit: 256m   # == deploy-Limit -> Swap aus, sauberer OOM statt Host-Thrashing
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: "0.5"
    # `mealprep_net` ist am 2026-09-06 entfallen. Es war ein Alias auf das
    # Default-Netz des mealprep-Projekts und existierte nur fuer die
    # Namensaufloesung. Gemessen: `mealprep` loest ueber cc-apps auf (10.210.3.x),
    # in dem beide Apps ohnehin haengen. Der Alias kostete ein `external`-Netz,
    # das ein Fremder nicht anlegen kann, weil es aus einem fremden
    # Compose-Projekt stammt.
    networks:
      - default
      - eingang-net
      - app-net

volumes:
  fitness-data:

# Lokal definiert statt `external: true`, damit dieses Compose ueberall laeuft
# und nicht nur auf dem einen Wirt, der die Bruecken vorher angelegt hat. Die
# Homelab-Sicht steht in `docker-compose.homelab.yml` und wird dort ueber
# COMPOSE_FILE in der .env mitgeladen.
#
# Die Namen heissen bewusst NICHT wie die Zonen (2026-10-06). Vorher stand
# hier `cc-proxy:` und `cc-apps:`, und ohne das Homelab-Override legte Compose
# daraus `fitness_cc-proxy` und `fitness_cc-apps` an: private Bruecken, die wie
# die Zone heissen und keine sind. Beide lagen auf host real herum
# (10.99.3.0/24 und 10.99.4.0/24, je 0 Container), waehrend der Dienst selbst in
# den echten Zonen hing. Gefaehrlich daran ist nicht die Waise, sondern der
# umgekehrte Fall: `docker-network-watcher` beobachtet genau die vier Namen
# `cc-proxy cc-core cc-apps cc-mgmt`, ein Container im Doppelgaenger ist fuer ihn
# unsichtbar. Mit einem eigenen Namen ist auf den ersten Blick zu sehen, dass es
# die Zone nicht ist. Das Override bildet sie weiterhin auf die echten Zonen ab.
#
# Subnetze sind Pflicht (Hausregel seit dem Vorfall 2026-06-16, geprueft von
# `docker/scripts/compose-subnetz-pflicht.py`). Beim Umbenennen fiel genau das
# zuerst durch: ohne `ipam` waren aus zwei Zonen-Doppelgaengern zwei echte
# Regelverstoesse geworden.
#
# Die Subnetze sind in ALLEN sechs Teilen und im Dach `saganta-suite`
# DIESELBEN, und das ist kein Fluechtigkeitsfehler. Das Dach bindet diese Datei
# per `include:` ein, gleichnamige Netze verschmelzen dabei zu einem, und bei
# abweichenden Subnetzen gewinnt stillschweigend das zuerst eingebundene
# (gemessen am 2026-10-06, ohne Warnung). Ein Satz je Netz ist damit die einzige
# widerspruchsfreie Vergabe. Belege in `docker/docs/SUBNETZE_BASIS_COMPOSE.md`.
networks:
  eingang-net:
    ipam:
      config:
        - subnet: 10.212.1.0/24
  app-net:
    ipam:
      config:
        - subnet: 10.212.2.0/24
